# Owner: W2 (backend). All secrets/config via environment variables — see /.env.example.
spring:
  application:
    name: study-monitor-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/study_monitor}
    username: ${DB_USERNAME:study_monitor}
    password: ${DB_PASSWORD:study_monitor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Demo databases may already have V1000; still apply newer schema files such as V2.
    out-of-order: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    async:
      request-timeout: -1

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT12H}
    issuer: study-monitor
  auth:
    refresh-ttl: ${REFRESH_TTL:P14D}
    refresh-reuse-grace: ${REFRESH_REUSE_GRACE:PT30S}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    agreements-version: ${AGREEMENTS_VERSION:2026-11-04}
    trusted-proxy: ${TRUSTED_PROXY:false}
    ip-limit-per-minute: ${AUTH_IP_LIMIT_PER_MINUTE:30}
    refresh-ip-limit-per-minute: ${REFRESH_IP_LIMIT_PER_MINUTE:120}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
    auth-base-url: ${KAKAO_AUTH_BASE_URL:https://kauth.kakao.com}
    api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed-demo-data: ${SEED_DEMO_DATA:false}
  monitoring:
    heartbeat-interval: PT30S
    heartbeat-timeout: PT90S
    timeout-scan-interval: PT10S
    max-future-skew: PT5S
    live-end-grace: PT45S
    sse-ping-interval: PT25S
  time-zone: Asia/Seoul
  late-reference-time: "09:00"

management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /v3/api-docs
