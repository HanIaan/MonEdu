# Owner: C0. Usage (from repo root):
#   cp .env.example .env   # then set JWT_SECRET
#   docker compose --env-file .env -f infra/docker-compose.yml up -d postgres          # DB only (dev)
#   docker compose --env-file .env -f infra/docker-compose.yml --profile app up -d --build  # full stack
name: study-monitor

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-study_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-study_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-study_monitor}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
